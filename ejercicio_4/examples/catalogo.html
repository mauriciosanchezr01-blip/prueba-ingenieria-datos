<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pagina de ejemplo</title>
</head>
<body>
    <h1>Catalogo de productos</h1>

    <img src="images/logo.png" alt="Logo de la empresa">

    <p>Nuestro producto estrella:</p>
    <img src="images/banner.jpg" alt="Banner" width="300">

    <p>Esta imagen no existe, para probar el manejo de errores:</p>
    <img src="images/no_existe.png" alt="No deberia encontrarse">

    <p>Esta imagen es remota, no se procesa:</p>
    <img src="https://ejemplo.com/foto.png" alt="Imagen remota">
</body>
</html>
